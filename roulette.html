<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SINED · Джекпот Рулетка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #0a0c18 0%, #03050b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
        }

        .roulette-card {
            background: rgba(12, 16, 28, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 64px;
            padding: 28px 20px 36px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            text-align: center;
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 160, 50, 0.25);
        }

        .brand-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            padding: 0 8px;
        }

        .sined-logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFD966, #FFA41E);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 3px rgba(0,0,0,0.2);
        }

        .jackpot-box {
            text-align: right;
        }

        .jackpot-label {
            font-size: 0.7rem;
            font-weight: 500;
            color: #FFB444;
            letter-spacing: 1px;
        }

        .jackpot-value {
            font-size: 2rem;
            font-weight: 800;
            color: #FFD966;
            line-height: 1;
            text-shadow: 0 0 6px #ffa41e80;
        }

        .wheel-wrapper {
            background: #0f1220;
            border-radius: 100px;
            padding: 20px 10px;
            margin: 12px 0 20px;
            box-shadow: inset 0 3px 8px #00000040, 0 6px 12px #00000030;
        }

        .wheel {
            font-size: clamp(3.5rem, 19vw, 6.5rem);
            transition: transform 1.8s cubic-bezier(0.17, 0.94, 0.38, 1);
            display: inline-block;
            width: 100%;
            text-align: center;
            filter: drop-shadow(0 8px 12px #00000060);
        }

        .spin-btn {
            background: radial-gradient(circle at 30% 20%, #FFBB44, #E05E00);
            border: none;
            padding: 18px 32px;
            border-radius: 100px;
            font-size: 1.7rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
            width: 90%;
            max-width: 280px;
            margin: 16px auto 12px;
            display: block;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 6px 0 #8B3C00;
            touch-action: manipulation;
        }

        .spin-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #8B3C00;
        }

        .result-area {
            background: #00000050;
            padding: 12px 14px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 500;
            color: #ffe1a0;
            backdrop-filter: blur(8px);
            margin: 10px 0;
            word-break: break-word;
        }

        .offers {
            background: #1a1e2c60;
            border-radius: 40px;
            padding: 8px 12px;
            margin-top: 20px;
            font-size: 0.7rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            color: #aaaec9;
        }

        .offer-item {
            background: #00000030;
            padding: 4px 10px;
            border-radius: 60px;
        }

        .footer-mark {
            font-size: 0.65rem;
            margin-top: 20px;
            color: #FFA41E;
            opacity: 0.7;
            text-align: center;
        }

        a {
            color: #FFB347;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="roulette-card">
    <div class="brand-row">
        <div class="sined-logo">⚡ SINED</div>
        <div class="jackpot-box">
            <div class="jackpot-label">ДЖЕКПОТ</div>
            <div class="jackpot-value" id="jackpotDisplay">204</div>
        </div>
    </div>

    <div class="wheel-wrapper">
        <div class="wheel" id="wheelIcon">🎡</div>
    </div>

    <button class="spin-btn" id="spinBtn">🌀 КРУТИТЬ</button>
    <div class="result-area" id="resultMessage">Нажми на кнопку</div>

    <div class="offers">
        <span class="offer-item">FIT SERVICE -12%</span>
        <span class="offer-item">Яндекс.Заправки -15%</span>
        <span class="offer-item">OZON -10%</span>
    </div>
    <div class="footer-mark">
        🧠 1 вращение / день | Выигрыш 0–5 л | +1–5 л в джекпот<br>
        <a href="#" target="_blank">AI-Startup.pro</a> — логистика, код, топливо
    </div>
</div>

<script>
    // Telegram WebApp
    let tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    // === ДЖЕКПОТ (локальное хранилище) ===
    let jackpot = localStorage.getItem("sined_jackpot");
    if (!jackpot) jackpot = 200;
    else jackpot = parseInt(jackpot);
    document.getElementById("jackpotDisplay").innerText = jackpot;

    function updateJackpot(addLiters) {
        jackpot += addLiters;
        localStorage.setItem("sined_jackpot", jackpot);
        document.getElementById("jackpotDisplay").innerText = jackpot;
    }

    // === 7 СЕКТОРОВ, СИММЕТРИЧНО. 3 ИЗ НИХ — 0 л ===
    // Индексы: 0,1,2,3,4,5,6
    const sectors = [
        { name: "0 л", value: 0 },   // сектор 0
        { name: "1 л", value: 1 },   // сектор 1
        { name: "0 л", value: 0 },   // сектор 2
        { name: "2 л", value: 2 },   // сектор 3
        { name: "0 л", value: 0 },   // сектор 4
        { name: "3 л", value: 3 },   // сектор 5
        { name: "5 л", value: 5 }    // сектор 6
    ];

    function getPrizeByIndex(index) {
        return sectors[index % sectors.length];
    }

    function getRandomPrize() {
        const idx = Math.floor(Math.random() * sectors.length);
        return getPrizeByIndex(idx);
    }

    // === ЗВУК (синтез) ===
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
    }
    function playSpinSound() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 880;
        gain.gain.value = 0.1;
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
        osc.stop(audioCtx.currentTime + 0.2);
    }

    let spinning = false;
    const wheel = document.getElementById("wheelIcon");
    const spinBtn = document.getElementById("spinBtn");
    const resultDiv = document.getElementById("resultMessage");

    function sendResultToBot(prizeValue) {
        if (!tg) return;
        tg.sendData(JSON.stringify({
            action: "roulette_result",
            prize: prizeValue,
            isSuper: prizeValue >= 5
        }));
        tg.close();
    }

    spinBtn.addEventListener("click", () => {
        if (spinning) return;
        spinning = true;
        spinBtn.disabled = true;
        playSpinSound();

        const prize = getRandomPrize();
        const addToJackpot = Math.floor(Math.random() * 5) + 1;
        updateJackpot(addToJackpot);

        // Визуальный эффект вращения
        const rotations = 360 * 8 + Math.floor(Math.random() * 720);
        wheel.style.transform = `rotate(${rotations}deg)`;

        setTimeout(() => {
            resultDiv.innerHTML = `✨ ВЫИГРЫШ: <strong>${prize.name}</strong> ✨<br>➕ Джекпот +${addToJackpot} л`;
            sendResultToBot(prize.value);
            setTimeout(() => {
                spinning = false;
                spinBtn.disabled = false;
            }, 500);
        }, 1600);
    });

    if (!tg) resultDiv.innerHTML = "⚙️ Тестовый режим (Telegram не обнаружен)";
</script>
</body>
</html>
