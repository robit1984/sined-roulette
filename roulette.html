<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SINED | Рулетка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0a0c12;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Orbitron', monospace;
            padding: 12px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0c12 0%, #1a1f2a 100%),
                        url('https://images.unsplash.com/photo-1513828583688-c52646c1d8913?w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            opacity: 0.6;
            z-index: -2;
        }

        .roulette-card {
            background: rgba(10, 14, 20, 0.85);
            backdrop-filter: blur(3px);
            border-radius: 40px;
            padding: 18px 16px 24px;
            width: 100%;
            max-width: 460px;
            margin: auto;
            text-align: center;
            border: 1px solid cyan;
            box-shadow: 0 0 20px rgba(0,255,255,0.2);
        }

        .jackpot-box {
            background: #07090e;
            border-radius: 60px;
            padding: 6px 16px;
            display: inline-block;
            margin-bottom: 16px;
            border: 1px solid #ff66cc;
        }
        .jackpot-label {
            color: #ff66cc;
            font-size: 12px;
        }
        .jackpot-value {
            font-size: 28px;
            font-weight: bold;
            color: gold;
        }

        .wheel-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 8px auto;
        }
        canvas {
            width: min(280px, 70vw);
            height: min(280px, 70vw);
            display: block;
            border-radius: 50%;
            box-shadow: 0 0 0 3px cyan, 0 0 15px cyan;
        }
        .pointer {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 34px solid #ff44cc;
            filter: drop-shadow(0 0 5px #ff44cc);
            z-index: 5;
        }

        .win-window {
            background: #0a0d14;
            border-radius: 48px;
            padding: 8px;
            margin: 16px 0;
            border: 1px solid cyan;
        }
        .win-digits {
            font-size: 40px;
            font-weight: bold;
            color: #0ff;
            text-shadow: 0 0 8px cyan;
        }

        .spin-btn {
            background: linear-gradient(90deg, #0c6, #0af);
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            font-size: 28px;
            font-weight: bold;
            color: #010101;
            cursor: pointer;
            margin: 10px 0;
        }
        .spin-btn:active {
            transform: scale(0.96);
        }

        .ticker {
            overflow: hidden;
            background: #000000aa;
            border-radius: 40px;
            padding: 8px 0;
            margin-top: 16px;
            border: 1px solid cyan;
            width: 100%;
        }
        .ticker-content {
            display: inline-block;
            white-space: nowrap;
            animation: scrollTicker 14s linear infinite;
            font-size: 12px;
            color: #0ff;
            font-weight: bold;
            padding-left: 10px;
        }
        .ticker-content span {
            margin: 0 12px;
        }
        @keyframes scrollTicker {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }

        .info-text {
            font-size: 10px;
            color: #8e9eae;
            margin-top: 12px;
        }

        .sound-ctrl {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: #11131ecc;
            border-radius: 50px;
            padding: 8px 12px;
            border: 1px solid cyan;
            font-size: 24px;
            cursor: pointer;
            z-index: 99;
            backdrop-filter: blur(4px);
        }

        @keyframes flash {
            0% { background: rgba(255,255,200,0); }
            30% { background: rgba(255,255,200,0.7); }
            100% { background: rgba(255,255,200,0); }
        }
        .flash {
            animation: flash 0.3s ease-out;
        }

        @media (max-width: 420px) {
            .roulette-card {
                padding: 14px 12px 20px;
            }
            .win-digits {
                font-size: 32px;
            }
            .spin-btn {
                font-size: 24px;
                padding: 12px;
            }
            .ticker-content {
                font-size: 10px;
            }
            .ticker-content span {
                margin: 0 8px;
            }
        }

        /* Для совсем маленьких экранов (iPhone SE, 5s) */
        @media (max-width: 360px) {
            canvas {
                width: min(240px, 65vw);
                height: min(240px, 65vw);
            }
            .win-digits {
                font-size: 28px;
            }
            .spin-btn {
                font-size: 22px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
<div class="roulette-card">
    <div class="jackpot-box">
        <div class="jackpot-label">🏆 ДЖЕКПОТ 🏆</div>
        <div class="jackpot-value" id="jackpotVal">187</div>
    </div>

    <div class="wheel-wrapper">
        <canvas id="rouletteCanvas" width="500" height="500"></canvas>
        <div class="pointer"></div>
    </div>

    <div class="win-window">
        <div class="win-digits"><span id="winAmount">0</span> л</div>
    </div>

    <button class="spin-btn" id="spinBtn">🎲 КРУТИТЬ</button>

    <div class="ticker">
        <div class="ticker-content" id="tickerText"></div>
    </div>

    <div class="info-text">
        1 вращение / день (1 $SINED) | Выигрыш 0–5 л | +1–5 л в джекпот
    </div>
</div>
<div class="sound-ctrl" id="soundToggle">🔊</div>

<script>
    (function() {
        const tg = window.Telegram.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const partners = [
            "🛒 Яндекс.Заправки -15%", "🛍️ OZON -10%", "🚗 Автодок -20%",
            "🏪 Лента -5%", "🔧 FIT SERVICE -12%"
        ];
        const tickerEl = document.getElementById('tickerText');
        tickerEl.innerHTML = partners.map(p => `<span>${p}</span>`).join('') +
                             partners.map(p => `<span>${p}</span>`).join('');

        const sectors = [0, 1, 2, 3, 4, 5];
        const colors = ["#ff3366", "#33ff66", "#ffcc33", "#33ffcc", "#ff66cc", "#ffaa33"];
        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');
        let angleCurrent = 0;
        let spinning = false;
        let jackpot = 187;
        let soundOn = true;
        let audioCtx = null;

        const jackpotSpan = document.getElementById('jackpotVal');
        const winSpan = document.getElementById('winAmount');
        const spinBtn = document.getElementById('spinBtn');
        const soundToggle = document.getElementById('soundToggle');

        jackpotSpan.innerText = jackpot;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function beep(freq, dur, vol = 0.2, type = 'sine') {
            if (!soundOn || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(vol, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
            osc.start();
            osc.stop(now + dur);
        }

        function clickSound() { beep(880, 0.05, 0.15); }
        function spinSound() {
            for (let i = 0; i < 10; i++) 
                setTimeout(() => beep(300 + i * 45, 0.05, 0.1, 'square'), i * 70);
        }
        function winSound(win) {
            if (win === 0) {
                beep(150, 0.5, 0.2, 'triangle');
            } else if (win <= 2) {
                beep(440, 0.3); beep(550, 0.3);
            } else if (win <= 4) {
                beep(523, 0.2); beep(659, 0.2); beep(784, 0.3);
            } else {
                beep(659, 0.15); beep(784, 0.15); beep(988, 0.3); beep(1318, 0.5);
            }
        }
        function flashScreen() {
            document.body.classList.add('flash');
            setTimeout(() => document.body.classList.remove('flash'), 350);
        }

        function drawWheel(angleRad) {
            const size = canvas.width;
            const center = size / 2;
            const rad = size * 0.48;
            ctx.clearRect(0, 0, size, size);
            const step = (Math.PI * 2) / sectors.length;
            for (let i = 0; i < sectors.length; i++) {
                const start = angleRad + i * step;
                const end = start + step;
                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, rad, start, end);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(start + step / 2);
                ctx.fillStyle = "#000";
                ctx.font = `bold ${Math.floor(size * 0.05)}px "Segoe UI"`;
                ctx.fillText(sectors[i].toString(), rad * 0.45, 10);
                ctx.restore();
            }
            ctx.beginPath();
            ctx.arc(center, center, rad * 0.22, 0, Math.PI * 2);
            ctx.fillStyle = "#11131f";
            ctx.fill();
            ctx.strokeStyle = "cyan";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = "white";
            ctx.font = `bold ${Math.floor(size * 0.045)}px monospace`;
            ctx.fillText("SINED", center - 42, center + 8);
        }

        function getWinByAngle(angleRad) {
            const step = (Math.PI * 2) / sectors.length;
            let rawAngle = (angleRad + Math.PI * 2) % (Math.PI * 2);
            for (let i = 0; i < sectors.length; i++) {
                const start = i * step;
                const end = start + step;
                if (rawAngle >= start && rawAngle < end) return sectors[i];
            }
            return sectors[0];
        }

        function spin() {
            if (spinning) return;
            initAudio();
            clickSound();
            spinning = true;
            spinBtn.disabled = true;
            spinSound();

            const rounds = Math.random() * (Math.PI * 2 * 6) + (Math.PI * 2 * 3);
            const startTime = performance.now();
            const duration = 2100;

            function animate(now) {
                const elapsed = now - startTime;
                const t = Math.min(1, elapsed / duration);
                const ease = 1 - Math.pow(1 - t, 3);
                const newAngle = angleCurrent + rounds * ease;
                drawWheel(newAngle);
                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    angleCurrent = (angleCurrent + rounds) % (Math.PI * 2);
                    drawWheel(angleCurrent);
                    const win = getWinByAngle(angleCurrent);
                    winSpan.innerText = win;
                    const add = Math.floor(Math.random() * 5) + 1;
                    jackpot += add;
                    jackpotSpan.innerText = jackpot;
                    winSound(win);
                    flashScreen();
                    if (tg && tg.sendData) tg.sendData(JSON.stringify({ prize: win }));
                    spinning = false;
                    spinBtn.disabled = false;
                    if (navigator.vibrate) navigator.vibrate(win * 20);
                }
            }
            requestAnimationFrame(animate);
        }

        function resizeCanvas() {
            const container = document.querySelector('.wheel-wrapper');
            const size = Math.min(container.clientWidth, 280);
            canvas.style.width = `${size}px`;
            canvas.style.height = `${size}px`;
            canvas.width = 500;
            canvas.height = 500;
            drawWheel(angleCurrent);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        spinBtn.addEventListener('click', spin);
        soundToggle.addEventListener('click', () => {
            soundOn = !soundOn;
            soundToggle.innerText = soundOn ? '🔊' : '🔇';
            if (soundOn && !audioCtx) initAudio();
        });
        document.body.addEventListener('touchstart', initAudio);
        document.body.addEventListener('click', initAudio);
        drawWheel(angleCurrent);
    })();
</script>
</body>
</html>
